<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Anime Waifu Hub</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div id="app-container" class="app-container">
        
 
        <div class="bg-shapes">
            <div class="shape shape-1"></div>
            <div class="shape shape-2"></div>
            <div class="shape shape-3"></div>
        </div>


        <main id="main-content" class="content-layout pos-left">
            

            <div id="character-wrapper" class="character-wrapper">
                <img id="character-img" src="" alt="Anime Character" class="character-img-cutout">
            </div>


            <div id="info-card" class="glass-card floating-card">
                <div class="bio-line">
                    <span class="bio-label">First Name:</span> 
                    <span id="bio-name" class="bio-value"></span>
                </div>
                <div class="bio-line">
                    <span class="bio-label">Last Name:</span> 
                    <span id="bio-last" class="bio-value"></span>
                </div>
                <div class="bio-line">
                    <span class="bio-label">Age:</span> 
                    <span id="bio-age" class="bio-value"></span>
                </div>
                <div class="bio-line">
                    <span class="bio-label">Personality:</span> 
                    <span id="bio-personality" class="bio-value"></span>
                </div>
                <div class="bio-line">
                    <span class="bio-label">Cup Size:</span> 
                    <span id="bio-cupsize" class="bio-value"></span>
                </div>
            </div>
        </main>


        <div class="nav-controls">
            <button id="prev-btn" class="nav-btn glass-btn">&lt;</button>
            <button id="next-btn" class="nav-btn glass-btn">&gt;</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
